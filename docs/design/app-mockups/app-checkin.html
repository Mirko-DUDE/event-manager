<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Area App — QR check-in</title>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --border: #e4e4e7;
    --text-primary: #18181b;
    --text-secondary: #71717a;
    --text-muted: #a1a1aa;
    --accent: #18181b;
    --accent-fg: #ffffff;
    --danger-bg: #fef2f2;
    --danger-text: #b91c1c;
    --danger-border: #fecaca;
    --warning-bg: #fffbeb;
    --warning-text: #92400e;
    --warning-border: #fde68a;
    --success-bg: #f0fdf4;
    --success-text: #15803d;
    --success-border: #bbf7d0;
    --pending-text: #a1a1aa;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    overflow-x: hidden;
    background: #f0f0f2;
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 40px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .phone-frame {
    width: 100%;
    max-width: min(380px, calc(100vw - 32px));
    background: var(--bg);
    height: 700px;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }

  .proto-controls {
    background: #fff7ed;
    border-bottom: 1px dashed #fdba74;
    padding: 8px 16px;
    font-size: 11px;
    color: #92400e;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    flex-shrink: 0;
    position: relative;
    z-index: 40;
  }
  .proto-controls button {
    font-size: 10.5px;
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid #fdba74;
    background: #fff;
    color: #92400e;
    font-weight: 600;
    cursor: pointer;
  }

  header.topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-shrink: 0;
  }
  .topbar-left { display:flex; align-items:center; gap:10px; }
  .event-name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .role-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .avatar-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-fg);
    display:flex; align-items:center; justify-content:center;
    font-size: 12px; font-weight: 600;
    border: none; cursor: pointer;
  }

  main.content {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  /* Idle state */
  .idle-wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 14px;
    padding: 32px 24px;
  }
  .idle-icon-circle {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .idle-icon-circle svg { width: 28px; height: 28px; color: var(--text-secondary); }
  .idle-title { font-size: 16px; font-weight: 700; }
  .idle-desc { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; max-width: 260px; }
  .activate-btn {
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: var(--radius);
    padding: 13px 22px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
  }
  .activate-btn svg { width: 16px; height: 16px; }

  /* Scanning state */
  .scan-view {
    position: absolute;
    inset: 0;
    background: #111214;
    display: flex;
    flex-direction: column;
  }
  .scan-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    color: #fff;
  }
  .scan-close-btn {
    background: rgba(255,255,255,0.12);
    border: none;
    color: #fff;
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .scan-close-btn svg { width: 15px; height: 15px; }
  .scan-title { font-size: 13px; font-weight: 600; }

  .scan-frame-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .scan-square {
    width: 220px; height: 220px;
    position: relative;
  }
  .scan-corner {
    position: absolute;
    width: 30px; height: 30px;
    border: 3px solid #fff;
  }
  .scan-corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
  .scan-corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
  .scan-corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
  .scan-corner.br { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 8px 0; }
  .scan-line {
    position: absolute;
    left: 6px; right: 6px;
    height: 2px;
    background: #22c55e;
    box-shadow: 0 0 8px #22c55e;
    animation: scanmove 1.8s ease-in-out infinite;
  }
  @keyframes scanmove {
    0% { top: 10px; }
    50% { top: 205px; }
    100% { top: 10px; }
  }

  .scan-hint {
    color: rgba(255,255,255,0.75);
    font-size: 12.5px;
    text-align: center;
    padding: 0 40px 40px;
  }

  /* Alert bottom sheet (duplicate / invalid), same pattern as contact card sheet */
  .alert-sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.2);
    z-index: 25;
    padding: 8px 20px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;
  }
  .alert-handle { display: flex; justify-content: center; padding: 0 0 6px; width: 100%; }
  .alert-handle-bar { width: 36px; height: 4px; border-radius: 4px; background: var(--border); }
  .alert-icon-circle {
    width: 48px; height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 2px;
  }
  .alert-icon-circle svg { width: 22px; height: 22px; }
  .alert-icon-circle.warning { background: var(--warning-bg); border: 1px solid var(--warning-border); }
  .alert-icon-circle.warning svg { color: var(--warning-text); }
  .alert-icon-circle.danger { background: var(--danger-bg); border: 1px solid var(--danger-border); }
  .alert-icon-circle.danger svg { color: var(--danger-text); }
  .alert-title { font-size: 15.5px; font-weight: 700; }
  .alert-desc { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; max-width: 270px; }
  .alert-desc strong { color: var(--text-primary); }
  .alert-actions { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 6px; }
  .alert-actions button {
    border-radius: var(--radius);
    padding: 11px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  .alert-actions .primary-alert-btn { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .alert-actions .secondary-alert-btn { background: var(--surface); color: var(--text-primary); }

  /* Bottom sheet (contact card, reused pattern) */
  .dim-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 20;
  }
  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.15);
    z-index: 25;
    max-height: 82%;
    display: flex;
    flex-direction: column;
  }
  .sheet-handle { display: flex; justify-content: center; padding: 8px 0 4px; }
  .sheet-handle-bar { width: 36px; height: 4px; border-radius: 4px; background: var(--border); }
  .sheet-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 16px 14px;
    border-bottom: 1px solid var(--border);
  }
  .sheet-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .sheet-title-block { flex: 1; min-width: 0; }
  .sheet-name { font-size: 15.5px; font-weight: 700; }
  .sheet-checkin-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    margin-top: 3px;
  }
  .sheet-checkin-pill.done { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); }
  .sheet-checkin-pill.pending { background: var(--bg); color: var(--pending-text); border: 1px solid var(--border); }
  .sheet-checkin-pill svg { width: 10px; height: 10px; }
  .close-btn {
    border: none;
    background: var(--bg);
    border-radius: 50%;
    width: 28px; height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .close-btn svg { width: 14px; height: 14px; }
  .sheet-body { overflow-y: auto; padding: 6px 16px 4px; flex: 1; }
  .field-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .field-row:last-child { border-bottom: none; }
  .field-label { font-size: 12px; color: var(--text-secondary); font-weight: 600; flex-shrink: 0; }
  .field-value { font-size: 13px; font-weight: 500; text-align: right; word-break: break-word; }
  .source-pill {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .sheet-footer {
    padding: 12px 16px 18px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .checkin-btn {
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .checkin-btn svg { width: 15px; height: 15px; }
  .scan-next-btn {
    background: var(--surface);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 16px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }

  nav.bottom-nav {
    position: relative;
    z-index: 5;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 6px 6px;
    flex-shrink: 0;
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 8px 4px;
    border-radius: 10px;
    border: none;
    background: none;
    color: var(--text-muted);
  }
  .nav-item.active { color: var(--text-primary); background: var(--bg); }
  .nav-item svg { width: 20px; height: 20px; }
  .nav-item span { font-size: 10.5px; font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>
<div class="hint" style="text-align:center; font-size:12px; color:#71717a; max-width: min(380px, calc(100vw - 32px));">
  Prototype: use the buttons in the orange bar to simulate what the scanner would detect (no real camera here).
</div>

<script>
const ICON_QR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM19 19h2v2h-2zM14 19h2M19 14h2"/></svg>';
const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
const ICON_ALERT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>';
const ICON_CONTACTS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>';

const CONTACT_MATCH = {
  first: "Giulia", last: "Rossi", email: "giulia.rossi@studio.it", phone: "+39 345 123 4567",
  company: "Milano", category: "Clients", source: "Hubspot"
};
const CONTACT_DUPLICATE = { first: "Marco", last: "Bianchi", time: "6:12 PM" };

// state: idle | scanning
let mode = "idle";
let scanAlert = null; // null | 'duplicate' | 'invalid'
let sheetOpen = false;
let checkedIn = false;

function renderIdle() {
  return (
    '<div class="idle-wrap">' +
      '<div class="idle-icon-circle">' + ICON_QR + '</div>' +
      '<div class="idle-title">Ready to check guests in</div>' +
      '<div class="idle-desc">Activate the scanner and point the camera at the QR code on the guest\u2019s ticket.</div>' +
      '<button class="activate-btn" id="activateBtn">' + ICON_QR + 'Activate scanner</button>' +
    '</div>'
  );
}

function renderScanning() {
  let alertHtml = "";
  if (scanAlert === "duplicate") {
    alertHtml =
      '<div class="dim-overlay" id="alertDimOverlay"></div>' +
      '<div class="alert-sheet">' +
        '<div class="alert-handle"><div class="alert-handle-bar"></div></div>' +
        '<div class="alert-icon-circle warning">' + ICON_ALERT + '</div>' +
        '<div class="alert-title">Already checked in</div>' +
        '<div class="alert-desc"><strong>' + CONTACT_DUPLICATE.first + ' ' + CONTACT_DUPLICATE.last + '</strong> was already checked in at ' + CONTACT_DUPLICATE.time + '.</div>' +
        '<div class="alert-actions">' +
          '<button class="primary-alert-btn" id="viewCardBtn">View contact card</button>' +
          '<button class="secondary-alert-btn" id="dismissAlertBtn">Keep scanning</button>' +
        '</div>' +
      '</div>';
  } else if (scanAlert === "invalid") {
    alertHtml =
      '<div class="dim-overlay" id="alertDimOverlay"></div>' +
      '<div class="alert-sheet">' +
        '<div class="alert-handle"><div class="alert-handle-bar"></div></div>' +
        '<div class="alert-icon-circle danger">' + ICON_ALERT + '</div>' +
        '<div class="alert-title">QR code not recognized</div>' +
        '<div class="alert-desc">This code may not belong to this event, or the ticket may not exist yet.</div>' +
        '<div class="alert-actions">' +
          '<button class="primary-alert-btn" id="dismissAlertBtn">Keep scanning</button>' +
        '</div>' +
      '</div>';
  }

  return (
    '<div class="scan-view">' +
      '<div class="scan-topbar">' +
        '<button class="scan-close-btn" id="scanCloseBtn">' + ICON_X + '</button>' +
        '<div class="scan-title">Scan guest QR code</div>' +
        '<div style="width:30px;"></div>' +
      '</div>' +
      '<div class="scan-frame-wrap">' +
        '<div class="scan-square">' +
          '<div class="scan-corner tl"></div><div class="scan-corner tr"></div>' +
          '<div class="scan-corner bl"></div><div class="scan-corner br"></div>' +
          (!scanAlert ? '<div class="scan-line"></div>' : '') +
        '</div>' +
      '</div>' +
      '<div class="scan-hint">Point the camera at the QR code on the guest\u2019s ticket.</div>' +
      alertHtml +
    '</div>'
  );
}

function renderSheet() {
  const initials = (CONTACT_MATCH.first[0] + CONTACT_MATCH.last[0]).toUpperCase();
  const checkinPill = checkedIn
    ? '<span class="sheet-checkin-pill done">' + ICON_CHECK + 'Checked in</span>'
    : '<span class="sheet-checkin-pill pending">Not checked in</span>';

  const footer = !checkedIn
    ? '<button class="checkin-btn" id="checkinBtn">' + ICON_CHECK + 'Check in</button>'
    : '<button class="scan-next-btn" id="scanNextBtn">Scan next guest</button>';

  return (
    '<div class="dim-overlay" id="dimOverlay"></div>' +
    '<div class="sheet">' +
      '<div class="sheet-handle"><div class="sheet-handle-bar"></div></div>' +
      '<div class="sheet-header">' +
        '<div class="sheet-avatar">' + initials + '</div>' +
        '<div class="sheet-title-block">' +
          '<div class="sheet-name">' + CONTACT_MATCH.first + ' ' + CONTACT_MATCH.last + '</div>' +
          checkinPill +
        '</div>' +
        '<button class="close-btn" id="closeSheetBtn">' + ICON_X + '</button>' +
      '</div>' +
      '<div class="sheet-body">' +
        '<div class="field-row"><span class="field-label">Email</span><span class="field-value">' + CONTACT_MATCH.email + '</span></div>' +
        '<div class="field-row"><span class="field-label">Phone</span><span class="field-value">' + CONTACT_MATCH.phone + '</span></div>' +
        '<div class="field-row"><span class="field-label">DUDE Company</span><span class="field-value">' + CONTACT_MATCH.company + '</span></div>' +
        '<div class="field-row"><span class="field-label">Category</span><span class="field-value">' + CONTACT_MATCH.category + '</span></div>' +
        '<div class="field-row"><span class="field-label">Source</span><span class="field-value"><span class="source-pill">' + CONTACT_MATCH.source + '</span></span></div>' +
      '</div>' +
      '<div class="sheet-footer">' + footer + '</div>' +
    '</div>'
  );
}

function render() {
  const mainInner = mode === "idle" ? renderIdle() : renderScanning();
  const sheetInner = sheetOpen ? renderSheet() : "";

  document.getElementById("root").innerHTML =
    '<div class="phone-frame">' +
      '<div class="proto-controls">' +
        '⚠ Simulate: ' +
        '<button id="simValid">Valid scan</button>' +
        '<button id="simDuplicate">Already checked in</button>' +
        '<button id="simInvalid">Unknown QR</button>' +
      '</div>' +
      '<header class="topbar">' +
        '<div class="topbar-left">' +
          '<div class="event-name">Event Manager</div>' +
          '<div class="role-badge">Hostess</div>' +
        '</div>' +
        '<button class="avatar-btn">H</button>' +
      '</header>' +
      '<main class="content">' + mainInner + sheetInner + '</main>' +
      '<nav class="bottom-nav">' +
        '<button class="nav-item">' + ICON_CONTACTS + '<span>Contacts</span></button>' +
        '<button class="nav-item active">' + ICON_QR + '<span>Check-in</span></button>' +
      '</nav>' +
    '</div>';

  const activateBtn = document.getElementById("activateBtn");
  if (activateBtn) activateBtn.addEventListener("click", () => { mode = "scanning"; scanAlert = null; render(); });

  const scanCloseBtn = document.getElementById("scanCloseBtn");
  if (scanCloseBtn) scanCloseBtn.addEventListener("click", () => { mode = "idle"; scanAlert = null; render(); });

  document.getElementById("simValid").addEventListener("click", () => {
    if (mode !== "scanning") { mode = "scanning"; }
    scanAlert = null;
    checkedIn = false;
    sheetOpen = true;
    render();
  });
  document.getElementById("simDuplicate").addEventListener("click", () => {
    if (mode !== "scanning") { mode = "scanning"; }
    sheetOpen = false;
    scanAlert = "duplicate";
    render();
  });
  document.getElementById("simInvalid").addEventListener("click", () => {
    if (mode !== "scanning") { mode = "scanning"; }
    sheetOpen = false;
    scanAlert = "invalid";
    render();
  });

  const dismissAlertBtn = document.getElementById("dismissAlertBtn");
  if (dismissAlertBtn) dismissAlertBtn.addEventListener("click", () => { scanAlert = null; render(); });
  const alertDimOverlay = document.getElementById("alertDimOverlay");
  if (alertDimOverlay) alertDimOverlay.addEventListener("click", () => { scanAlert = null; render(); });

  const viewCardBtn = document.getElementById("viewCardBtn");
  if (viewCardBtn) {
    viewCardBtn.addEventListener("click", () => {
      scanAlert = null;
      checkedIn = true; // duplicate means already checked in
      sheetOpen = true;
      render();
    });
  }

  const dimOverlay = document.getElementById("dimOverlay");
  if (dimOverlay) dimOverlay.addEventListener("click", () => { sheetOpen = false; render(); });
  const closeSheetBtn = document.getElementById("closeSheetBtn");
  if (closeSheetBtn) closeSheetBtn.addEventListener("click", () => { sheetOpen = false; render(); });
  const checkinBtn = document.getElementById("checkinBtn");
  if (checkinBtn) checkinBtn.addEventListener("click", () => { checkedIn = true; render(); });
  const scanNextBtn = document.getElementById("scanNextBtn");
  if (scanNextBtn) scanNextBtn.addEventListener("click", () => { sheetOpen = false; checkedIn = false; render(); });
}

render();
</script>
</body>
</html>
