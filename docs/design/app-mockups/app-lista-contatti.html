<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Area App — Contacts</title>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --border: #e4e4e7;
    --text-primary: #18181b;
    --text-secondary: #71717a;
    --text-muted: #a1a1aa;
    --accent: #18181b;
    --accent-fg: #ffffff;
    --success-bg: #f0fdf4;
    --success-text: #15803d;
    --success-border: #bbf7d0;
    --pending-text: #a1a1aa;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    overflow-x: hidden;
    background: #f0f0f2;
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 40px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .phone-frame {
    width: 100%;
    max-width: min(380px, calc(100vw - 32px));
    background: var(--bg);
    height: 700px;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }

  header.topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-shrink: 0;
  }
  .topbar-left { display:flex; align-items:center; gap:10px; }
  .event-name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .role-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .avatar-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-fg);
    display:flex; align-items:center; justify-content:center;
    font-size: 12px; font-weight: 600;
    border: none; cursor: pointer;
  }

  .search-zone {
    background: var(--bg);
    padding: 12px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }
  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 12px;
  }
  .search-box svg { width: 16px; height: 16px; color: var(--text-muted); flex-shrink: 0; }
  .search-box input {
    border: none;
    outline: none;
    font-size: 14px;
    flex: 1;
    background: transparent;
    color: var(--text-primary);
  }
  .search-box .clear-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    display: none;
    padding: 2px;
  }
  .search-box .clear-btn.show { display: flex; }
  .search-box .clear-btn svg { width: 14px; height: 14px; }

  .controls-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .segmented {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 3px;
    gap: 2px;
    flex: 1;
  }
  .segmented button {
    flex: 1;
    border: none;
    background: none;
    padding: 10px 4px;
    min-height: 40px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .segmented button.active {
    background: var(--accent);
    color: var(--accent-fg);
  }
  .segmented .count {
    font-size: 10px;
    opacity: 0.75;
  }

  .sort-select {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0 4px 0 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    min-height: 40px;
    width: 100%;
  }
  .sort-select .sort-label {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .sort-select svg.sort-icon { width: 13px; height: 13px; flex-shrink: 0; }
  .sort-select .sort-controls {
    display: flex;
    align-items: center;
    flex: 1;
    min-width: 0;
  }
  .sort-select select {
    border: none;
    background: none;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-primary);
    padding: 10px 2px;
    outline: none;
    text-align: left;
    flex: 1;
    min-width: 0;
  }
  .sort-dir-btn {
    border: none;
    background: none;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 34px;
    min-height: 40px;
    border-left: 1px solid var(--border);
  }
  .sort-dir-btn svg { width: 14px; height: 14px; }

  .list-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0 90px;
  }
  .contact-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    background: var(--surface);
  }
  .contact-row:active { background: var(--bg); }
  .contact-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .contact-info { flex: 1; min-width: 0; }
  .contact-name {
    font-size: 13.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .checkin-pill {
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .checkin-pill.done { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); }
  .checkin-pill.pending { background: var(--bg); color: var(--pending-text); border: 1px solid var(--border); }
  .checkin-pill svg { width: 11px; height: 11px; }

  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-muted);
    font-size: 13px;
  }

  nav.bottom-nav {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 6px 6px;
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 8px 4px;
    border-radius: 10px;
    border: none;
    background: none;
    color: var(--text-muted);
  }
  .nav-item.active { color: var(--text-primary); background: var(--bg); }
  .nav-item svg { width: 20px; height: 20px; }
  .nav-item span { font-size: 10.5px; font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>
<div class="hint" style="text-align:center; font-size:12px; color:#71717a; max-width: min(380px, calc(100vw - 32px));">
  Try typing in the search bar, switching the filter, and changing the sort order — all live in this prototype.
</div>

<script>
const ICON_SEARCH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>';
const ICON_CLOSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
const ICON_SORT = '<svg class="sort-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M6 12h12M10 18h4"/></svg>';
const ICON_ARROW_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>';
const ICON_ARROW_DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M18 13l-6 6-6-6"/></svg>';
const ICON_CONTATTI = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>';
const ICON_CHECKIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>';

const CONTACTS = [
  { first: "Marco", last: "Bianchi", email: "marco.bianchi@acme.it", checkedIn: true },
  { first: "Giulia", last: "Rossi", email: "giulia.rossi@studio.it", checkedIn: false },
  { first: "Luca", last: "Ferrari", email: "luca.ferrari@techco.it", checkedIn: true },
  { first: "Sara", last: "Conti", email: "sara.conti@brand.it", checkedIn: false },
  { first: "Andrea", last: "Ricci", email: "andrea.ricci@acme.it", checkedIn: false },
  { first: "Elena", last: "Marino", email: "elena.marino@studio.it", checkedIn: true },
  { first: "Davide", last: "Greco", email: "davide.greco@techco.it", checkedIn: false },
  { first: "Chiara", last: "Bruno", email: "chiara.bruno@brand.it", checkedIn: true },
  { first: "Matteo", last: "Villa", email: "matteo.villa@acme.it", checkedIn: false },
  { first: "Francesca", last: "Costa", email: "francesca.costa@studio.it", checkedIn: false },
  { first: "Simone", last: "Fontana", email: "simone.fontana@techco.it", checkedIn: true },
  { first: "Alice", last: "Moretti", email: "alice.moretti@brand.it", checkedIn: false }
];

let query = "";
let filter = "all"; // all | done | pending
let sortBy = "last"; // first | last
let sortDir = "asc"; // asc | desc

function matches(c) {
  const q = query.trim().toLowerCase();
  const textMatch = !q || c.first.toLowerCase().includes(q) || c.last.toLowerCase().includes(q) || c.email.toLowerCase().includes(q);
  const statusMatch = filter === "all" || (filter === "done" && c.checkedIn) || (filter === "pending" && !c.checkedIn);
  return textMatch && statusMatch;
}

function render() {
  let filtered = CONTACTS.filter(matches);
  filtered = filtered.slice().sort((a, b) => {
    const av = sortBy === "first" ? a.first : a.last;
    const bv = sortBy === "first" ? b.first : b.last;
    const cmp = av.localeCompare(bv);
    return sortDir === "asc" ? cmp : -cmp;
  });

  const q = query.trim().toLowerCase();
  const textFiltered = CONTACTS.filter(c => !q || c.first.toLowerCase().includes(q) || c.last.toLowerCase().includes(q) || c.email.toLowerCase().includes(q));
  const countAll = textFiltered.length;
  const countDone = textFiltered.filter(c => c.checkedIn).length;
  const countPending = countAll - countDone;

  const rowsHtml = filtered.length ? filtered.map(c => {
    const initials = (c.first[0] + c.last[0]).toUpperCase();
    const pill = c.checkedIn
      ? '<span class="checkin-pill done">' + ICON_CHECK + 'Checked in</span>'
      : '<span class="checkin-pill pending">Not checked in</span>';
    return '<div class="contact-row">' +
      '<div class="contact-avatar">' + initials + '</div>' +
      '<div class="contact-info"><div class="contact-name">' + c.first + ' ' + c.last + '</div></div>' +
      pill +
    '</div>';
  }).join("") : '<div class="empty-state">No contacts found.<br>Try changing your search or filter.</div>';

  document.getElementById("root").innerHTML =
    '<div class="phone-frame">' +
      '<header class="topbar">' +
        '<div class="topbar-left">' +
          '<div class="event-name">Event Manager</div>' +
          '<div class="role-badge">Hostess</div>' +
        '</div>' +
        '<button class="avatar-btn">H</button>' +
      '</header>' +
      '<div class="search-zone">' +
        '<div class="search-box">' +
          ICON_SEARCH +
          '<input id="searchInput" type="text" placeholder="Search by first name, last name or email" value="' + query.replace(/"/g,"&quot;") + '">' +
          '<button class="clear-btn ' + (query ? "show" : "") + '" id="clearBtn">' + ICON_CLOSE + '</button>' +
        '</div>' +
        '<div class="controls-row">' +
          '<div class="segmented">' +
            '<button class="' + (filter === "all" ? "active" : "") + '" data-filter="all">All <span class="count">' + countAll + '</span></button>' +
            '<button class="' + (filter === "pending" ? "active" : "") + '" data-filter="pending">NOT <span class="count">' + countPending + '</span></button>' +
            '<button class="' + (filter === "done" ? "active" : "") + '" data-filter="done">IN <span class="count">' + countDone + '</span></button>' +
          '</div>' +
          '<div class="sort-select">' +
            '<span class="sort-label">' + ICON_SORT + 'Sort by</span>' +
            '<span class="sort-controls">' +
              '<select id="sortSelect">' +
                '<option value="last"' + (sortBy === "last" ? " selected" : "") + '>Last name</option>' +
                '<option value="first"' + (sortBy === "first" ? " selected" : "") + '>First name</option>' +
              '</select>' +
              '<button id="sortDirBtn" class="sort-dir-btn" title="Toggle sort direction">' + (sortDir === "asc" ? ICON_ARROW_UP : ICON_ARROW_DOWN) + '</button>' +
            '</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="list-scroll">' + rowsHtml + '</div>' +
      '<nav class="bottom-nav">' +
        '<button class="nav-item active">' + ICON_CONTATTI + '<span>Contacts</span></button>' +
        '<button class="nav-item">' + ICON_CHECKIN + '<span>Check-in</span></button>' +
      '</nav>' +
    '</div>';

  const input = document.getElementById("searchInput");
  input.addEventListener("input", (e) => {
    query = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const newInput = document.getElementById("searchInput");
    newInput.focus();
    newInput.setSelectionRange(pos, pos);
  });
  document.getElementById("clearBtn").addEventListener("click", () => {
    query = "";
    render();
    document.getElementById("searchInput").focus();
  });
  document.querySelectorAll(".segmented button").forEach(btn => {
    btn.addEventListener("click", () => {
      filter = btn.dataset.filter;
      render();
    });
  });
  document.getElementById("sortSelect").addEventListener("change", (e) => {
    sortBy = e.target.value;
    render();
  });
  document.getElementById("sortDirBtn").addEventListener("click", () => {
    sortDir = sortDir === "asc" ? "desc" : "asc";
    render();
  });
}

render();
</script>
</body>
</html>
