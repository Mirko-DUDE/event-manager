<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Area App — Contact detail (bottom sheet)</title>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --border: #e4e4e7;
    --text-primary: #18181b;
    --text-secondary: #71717a;
    --text-muted: #a1a1aa;
    --accent: #18181b;
    --accent-fg: #ffffff;
    --success-bg: #f0fdf4;
    --success-text: #15803d;
    --success-border: #bbf7d0;
    --pending-text: #a1a1aa;
    --whatsapp: #25D366;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    overflow-x: hidden;
    background: #f0f0f2;
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 40px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .phone-frame {
    width: 100%;
    max-width: min(380px, calc(100vw - 32px));
    background: var(--bg);
    height: 700px;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }

  .proto-controls {
    background: #fff7ed;
    border-bottom: 1px dashed #fdba74;
    padding: 8px 16px;
    font-size: 11px;
    color: #92400e;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    flex-shrink: 0;
    position: relative;
    z-index: 30;
  }
  .proto-controls select {
    font-size: 11px;
    padding: 3px 6px;
    border-radius: 6px;
    border: 1px solid #fdba74;
    background: #fff;
    color: #92400e;
    font-weight: 600;
  }

  .backdrop-list {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: var(--surface);
  }
  .backdrop-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    font-weight: 600;
  }
  .backdrop-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .backdrop-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .backdrop-row.active { background: #f4f4f5; }
  .backdrop-name { font-size: 13.5px; font-weight: 600; }

  .dim-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .dim-overlay.show { opacity: 1; pointer-events: auto; }

  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.15);
    z-index: 20;
    max-height: 88%;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.25s ease-out;
  }
  .sheet.open { transform: translateY(0); }

  .sheet-handle {
    display: flex;
    justify-content: center;
    padding: 8px 0 4px;
  }
  .sheet-handle-bar {
    width: 36px; height: 4px;
    border-radius: 4px;
    background: var(--border);
  }

  .sheet-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 16px 14px;
    border-bottom: 1px solid var(--border);
  }
  .sheet-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .sheet-title-block { flex: 1; min-width: 0; }
  .sheet-name { font-size: 15.5px; font-weight: 700; }
  .sheet-checkin-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    margin-top: 3px;
  }
  .sheet-checkin-pill.done { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); }
  .sheet-checkin-pill.pending { background: var(--bg); color: var(--pending-text); border: 1px solid var(--border); }
  .sheet-checkin-pill svg { width: 10px; height: 10px; }
  .close-btn {
    border: none;
    background: var(--bg);
    border-radius: 50%;
    width: 28px; height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .close-btn svg { width: 14px; height: 14px; }

  .sheet-body {
    overflow-y: auto;
    padding: 6px 16px 4px;
    flex: 1;
  }
  .field-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .field-row:last-child { border-bottom: none; }
  .field-label { font-size: 12px; color: var(--text-secondary); font-weight: 600; flex-shrink: 0; }
  .field-value { font-size: 13px; font-weight: 500; text-align: right; word-break: break-word; }
  .field-value.muted { color: var(--text-muted); font-weight: 400; }
  .source-pill {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }

  .sheet-footer {
    padding: 12px 16px 18px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .checkin-btn {
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .checkin-btn svg { width: 15px; height: 15px; }

  .undo-btn {
    background: var(--surface);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 16px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }

  .resend-row {
    display: flex;
    gap: 8px;
  }
  .resend-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-radius: var(--radius);
    padding: 10px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
  }
  .resend-btn svg { width: 14px; height: 14px; }
  .resend-btn.whatsapp { color: var(--whatsapp); border-color: #bbf0cf; }

  .resend-label { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-bottom: -2px; }

  .reopen-btn {
    position: absolute;
    bottom: 16px; left: 16px; right: 16px;
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: var(--radius);
    padding: 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    z-index: 25;
  }
</style>
</head>
<body>
<div id="root"></div>
<div class="hint" style="text-align:center; font-size:12px; color:#71717a; max-width: min(380px, calc(100vw - 32px));">
  Prototype: switch role and check-in state above. Tap a contact row to open the sheet, and the X / backdrop to close.
</div>

<script>
const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
const ICON_WA = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 6.3A8.9 8.9 0 0 0 12 4a8.9 8.9 0 0 0-7.6 13.6L3 21l3.5-1.3A8.9 8.9 0 0 0 12 21a9 9 0 0 0 5.6-14.7zM12 19.3a7.3 7.3 0 0 1-3.7-1l-.3-.2-2.1.8.7-2-.2-.3A7.3 7.3 0 1 1 19.3 12 7.3 7.3 0 0 1 12 19.3zm4-5.5c-.2-.1-1.3-.6-1.5-.7-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1-1.2-.6-2-1-2.8-2.3-.2-.3.2-.3.5-.9.1-.2 0-.3 0-.5l-.6-1.4c-.1-.3-.3-.3-.5-.3h-.4c-.1 0-.4.1-.6.4-.2.3-.8.8-.8 1.9 0 1.1.8 2.2.9 2.3.1.2 1.5 2.4 3.7 3.3 1.8.7 2.2.6 2.6.5.4-.1 1.3-.5 1.5-1 .2-.5.2-.9.1-1z"/></svg>';
const ICON_MAIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M22 6l-10 7L2 6"/></svg>';

const CONTACT = {
  first: "Giulia",
  last: "Rossi",
  email: "giulia.rossi@studio.it",
  phone: "+39 345 123 4567",
  assegnazione: "m.rossi",
  company: "Milano",
  category: "Clients",
  source: "Hubspot"
};

const ROLES = ["Hostess", "Manager", "Full access"];
let role = "Manager";
let checkedIn = false;
let sheetOpen = true;

function render() {
  const initials = (CONTACT.first[0] + CONTACT.last[0]).toUpperCase();
  const checkinPill = checkedIn
    ? '<span class="sheet-checkin-pill done">' + ICON_CHECK + 'Checked in</span>'
    : '<span class="sheet-checkin-pill pending">Not checked in</span>';

  const checkinDateRow = checkedIn
    ? '<div class="field-row"><span class="field-label">Check-in date</span><span class="field-value">Aug 6, 2026 \u2013 6:42 PM</span></div>' +
      '<div class="field-row"><span class="field-label">Checked in by</span><span class="field-value">h.desai@company.com</span></div>'
    : "";

  const canResend = role === "Manager" || role === "Full access";
  const canUndo = role === "Full access";

  let footer = "";
  if (!checkedIn) {
    footer += '<button class="checkin-btn" id="checkinBtn">' + ICON_CHECK + 'Check in</button>';
  } else if (canUndo) {
    footer += '<button class="undo-btn" id="undoBtn">Undo check-in</button>';
  } else {
    footer += '<div class="field-row" style="border-bottom:none; padding-top:0;"><span class="field-value muted" style="text-align:left;">Only Full access can undo a check-in.</span></div>';
  }

  if (canResend) {
    footer +=
      '<div class="resend-label">Resend ticket</div>' +
      '<div class="resend-row">' +
        '<button class="resend-btn whatsapp">' + ICON_WA + 'WhatsApp</button>' +
        '<button class="resend-btn">' + ICON_MAIL + 'Email</button>' +
      '</div>';
  }

  document.getElementById("root").innerHTML =
    '<div class="phone-frame">' +
      '<div class="proto-controls">' +
        '⚠ Prototype only:' +
        '<select id="roleSelect">' + ROLES.map(r => '<option' + (r === role ? ' selected' : '') + '>' + r + '</option>').join("") + '</select>' +
        '<label style="display:flex; align-items:center; gap:4px;"><input type="checkbox" id="checkinToggle" ' + (checkedIn ? "checked" : "") + '> Checked in</label>' +
      '</div>' +
      '<div class="backdrop-list">' +
        '<div class="backdrop-header">Contacts</div>' +
        '<div class="backdrop-row active" data-open="true"><div class="backdrop-avatar">' + initials + '</div><div class="backdrop-name">' + CONTACT.first + ' ' + CONTACT.last + '</div></div>' +
        '<div class="backdrop-row" data-open="true"><div class="backdrop-avatar">MB</div><div class="backdrop-name">Marco Bianchi</div></div>' +
        '<div class="backdrop-row" data-open="true"><div class="backdrop-avatar">LF</div><div class="backdrop-name">Luca Ferrari</div></div>' +
        '<div class="backdrop-row" data-open="true"><div class="backdrop-avatar">SC</div><div class="backdrop-name">Sara Conti</div></div>' +
        '<div class="dim-overlay ' + (sheetOpen ? "show" : "") + '" id="dimOverlay"></div>' +
        '<div class="sheet ' + (sheetOpen ? "open" : "") + '" id="sheet">' +
          '<div class="sheet-handle"><div class="sheet-handle-bar"></div></div>' +
          '<div class="sheet-header">' +
            '<div class="sheet-avatar">' + initials + '</div>' +
            '<div class="sheet-title-block">' +
              '<div class="sheet-name">' + CONTACT.first + ' ' + CONTACT.last + '</div>' +
              checkinPill +
            '</div>' +
            '<button class="close-btn" id="closeBtn">' + ICON_X + '</button>' +
          '</div>' +
          '<div class="sheet-body">' +
            '<div class="field-row"><span class="field-label">Email</span><span class="field-value">' + CONTACT.email + '</span></div>' +
            '<div class="field-row"><span class="field-label">Phone</span><span class="field-value">' + CONTACT.phone + '</span></div>' +
            '<div class="field-row"><span class="field-label">Assegnazione</span><span class="field-value">' + CONTACT.assegnazione + '</span></div>' +
            '<div class="field-row"><span class="field-label">DUDE Company</span><span class="field-value">' + CONTACT.company + '</span></div>' +
            '<div class="field-row"><span class="field-label">Category</span><span class="field-value">' + CONTACT.category + '</span></div>' +
            '<div class="field-row"><span class="field-label">Source</span><span class="field-value"><span class="source-pill">' + CONTACT.source + '</span></span></div>' +
            checkinDateRow +
          '</div>' +
          '<div class="sheet-footer">' + footer + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.getElementById("roleSelect").addEventListener("change", (e) => { role = e.target.value; render(); });
  document.getElementById("checkinToggle").addEventListener("change", (e) => { checkedIn = e.target.checked; render(); });
  document.getElementById("closeBtn").addEventListener("click", () => { sheetOpen = false; render(); });
  document.getElementById("dimOverlay").addEventListener("click", () => { sheetOpen = false; render(); });
  document.querySelectorAll('[data-open="true"]').forEach(row => {
    row.addEventListener("click", () => { sheetOpen = true; render(); });
  });
  const checkinBtn = document.getElementById("checkinBtn");
  if (checkinBtn) checkinBtn.addEventListener("click", () => { checkedIn = true; render(); });
  const undoBtn = document.getElementById("undoBtn");
  if (undoBtn) undoBtn.addEventListener("click", () => { checkedIn = false; render(); });
}

render();
</script>
</body>
</html>
