<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Area App — Forgot password</title>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --border: #e4e4e7;
    --text-primary: #18181b;
    --text-secondary: #71717a;
    --text-muted: #a1a1aa;
    --accent: #18181b;
    --accent-fg: #ffffff;
    --danger-bg: #fef2f2;
    --danger-text: #b91c1c;
    --danger-border: #fecaca;
    --success-bg: #f0fdf4;
    --success-text: #15803d;
    --success-border: #bbf7d0;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    overflow-x: hidden;
    background: #f0f0f2;
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 40px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .phone-frame {
    width: 100%;
    max-width: min(380px, calc(100vw - 32px));
    background: var(--bg);
    min-height: 660px;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }

  .proto-controls {
    background: #fff7ed;
    border-bottom: 1px dashed #fdba74;
    padding: 8px 16px;
    font-size: 11px;
    color: #92400e;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .proto-controls select {
    font-size: 11px;
    padding: 3px 6px;
    border-radius: 6px;
    border: 1px solid #fdba74;
    background: #fff;
    color: #92400e;
    font-weight: 600;
  }

  main.content {
    flex: 1;
    padding: 48px 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .back-link {
    font-size: 12.5px;
    color: var(--text-secondary);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 4px;
  }

  .brand-name { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .brand-sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 4px; line-height: 1.5; }

  .icon-circle {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 4px;
  }
  .icon-circle svg { width: 22px; height: 22px; color: var(--text-secondary); }
  .icon-circle.success { background: var(--success-bg); border-color: var(--success-border); }
  .icon-circle.success svg { color: var(--success-text); }
  .icon-circle.danger { background: var(--danger-bg); border-color: var(--danger-border); }
  .icon-circle.danger svg { color: var(--danger-text); }

  form { display: flex; flex-direction: column; gap: 12px; }
  label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 4px;
    display: block;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 13.5px;
    background: var(--surface);
    color: var(--text-primary);
  }
  input:focus { outline: 2px solid var(--text-primary); outline-offset: 1px; }

  .hint-text { font-size: 11.5px; color: var(--text-muted); margin-top: -4px; }

  .submit-btn {
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: var(--radius);
    padding: 11px 16px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }
  .submit-btn:hover { opacity: 0.9; }

  .secondary-btn {
    background: var(--surface);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 11px 16px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }

  .resend-row {
    text-align: center;
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .resend-row a { color: var(--text-primary); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<div id="root"></div>
<div class="hint" style="text-align:center; font-size:12px; color:#71717a; max-width: min(380px, calc(100vw - 32px));">
  The selector above just lets you jump between steps of the flow for the prototype.
</div>

<script>
const ICONS = {
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M22 6l-10 7L2 6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>',
  arrowleft: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>'
};

const STEPS = {
  request:  { label: "1 · Request link" },
  sent:     { label: "2 · Email sent" },
  new_pwd:  { label: "3 · New password" },
  done:     { label: "4 · Password updated" },
  invalid:  { label: "Error · Invalid/expired link" }
};

let currentStep = "request";

function render() {
  let inner = "";

  if (currentStep === "request") {
    inner =
      '<a href="#" class="back-link">' + ICONS.arrowleft + 'Back to login</a>' +
      '<div>' +
        '<div class="brand-name">Forgot password</div>' +
        '<div class="brand-sub">Enter your work email: if it\u2019s registered, we\u2019ll send you a link to reset your password.</div>' +
      '</div>' +
      '<form>' +
        '<div>' +
          '<label>Email</label>' +
          '<input type="email" placeholder="name@company.com">' +
        '</div>' +
        '<button class="submit-btn" type="button" onclick="goTo(\'sent\')">Send link</button>' +
      '</form>';

  } else if (currentStep === "sent") {
    inner =
      '<div class="icon-circle">' + ICONS.mail + '</div>' +
      '<div>' +
        '<div class="brand-name">Check your email</div>' +
        '<div class="brand-sub">If <strong>m***@company.com</strong> is registered, you\u2019ll receive a link to reset your password within a few minutes.</div>' +
      '</div>' +
      '<div class="resend-row">Didn\u2019t get anything? <a href="#" onclick="goTo(\'sent\')">Resend email</a></div>' +
      '<a href="#" class="back-link" style="margin-top:8px;">' + ICONS.arrowleft + 'Back to login</a>';

  } else if (currentStep === "new_pwd") {
    inner =
      '<div class="icon-circle">' + ICONS.lock + '</div>' +
      '<div>' +
        '<div class="brand-name">Set a new password</div>' +
        '<div class="brand-sub">Choose a password you haven\u2019t already used for this account.</div>' +
      '</div>' +
      '<form>' +
        '<div>' +
          '<label>New password</label>' +
          '<input type="password" placeholder="••••••••">' +
          '<div class="hint-text">At least 8 characters.</div>' +
        '</div>' +
        '<div>' +
          '<label>Confirm password</label>' +
          '<input type="password" placeholder="••••••••">' +
        '</div>' +
        '<button class="submit-btn" type="button" onclick="goTo(\'done\')">Save new password</button>' +
      '</form>';

  } else if (currentStep === "done") {
    inner =
      '<div class="icon-circle success">' + ICONS.check + '</div>' +
      '<div>' +
        '<div class="brand-name">Password updated</div>' +
        '<div class="brand-sub">Your password has been changed successfully. You can now sign in with your new credentials.</div>' +
      '</div>' +
      '<button class="submit-btn" type="button">Go to login</button>';

  } else if (currentStep === "invalid") {
    inner =
      '<div class="icon-circle danger">' + ICONS.alert + '</div>' +
      '<div>' +
        '<div class="brand-name">Invalid or expired link</div>' +
        '<div class="brand-sub">The link you used is no longer valid. Request a new one to continue.</div>' +
      '</div>' +
      '<button class="submit-btn" type="button" onclick="goTo(\'request\')">Request a new link</button>' +
      '<a href="#" class="back-link" style="justify-content:center; margin-top:4px;">' + ICONS.arrowleft + 'Back to login</a>';
  }

  document.getElementById("root").innerHTML =
    '<div class="phone-frame">' +
      '<div class="proto-controls">' +
        '⚠ Prototype only:' +
        '<select id="stepSelect">' +
          Object.keys(STEPS).map(s => '<option value="' + s + '"' + (s === currentStep ? ' selected' : '') + '>' + STEPS[s].label + '</option>').join("") +
        '</select>' +
      '</div>' +
      '<main class="content">' + inner + '</main>' +
    '</div>';

  document.getElementById("stepSelect").addEventListener("change", (e) => {
    currentStep = e.target.value;
    render();
  });
}

function goTo(step) {
  currentStep = step;
  render();
}

render();
</script>
</body>
</html>
